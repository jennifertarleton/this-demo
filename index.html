<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Left of the Dot</title>
  <style>
    :root {
      --bg: #fffcf9;
      --ink: #1e293b;
      --muted: #64748b;
      --blue: #4e89bd;
      --red: #e06c75;
      --green: #3f8f5a;
      --gold: #d79b2b;
      --line: #e2dcd3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Inter, system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    h1 { margin: 24px 24px 0; font-size: 1.6rem; text-align: center; }

    .stage {
      flex: 1;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      justify-content: center;
    }

    /* The outside: where an arrow function looks for this */
    .outside {
      position: relative;
      border: 3px dashed var(--line);
      border-radius: 18px;
      padding: 40px 20px 20px;
      transition: border-color 0.4s, background 0.4s;
    }

    .outside .tag {
      position: absolute;
      top: 10px;
      left: 18px;
      color: var(--muted);
      font-weight: 700;
    }

    .outside.lit { border-color: var(--red); background: #fdf0f1; }
    .outside.lit .tag { color: var(--red); }

    .trucks { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    .truck {
      border: 3px solid var(--ink);
      border-radius: 14px;
      background: white;
      padding: 14px 16px;
      transition: box-shadow 0.4s, border-color 0.4s;
    }

    .truck.lit { border-color: var(--blue); box-shadow: 0 0 0 7px #cfe2f3; }

    .truck .title { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }

    pre {
      margin: 0;
      font-family: Consolas, monospace;
      font-size: 1.02rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .this-word { transition: background 0.3s, color 0.3s; border-radius: 3px; }
    .hl-this .this-word { background: var(--gold); color: var(--ink); padding: 0 2px; }
    .arrow-syntax { color: var(--red); font-weight: 700; }

    /* The call line and its answer */
    .call {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      min-height: 3.5em;
      font-family: Consolas, monospace;
      font-size: 1.5rem;
    }

    .call .left { border-bottom: 4px solid transparent; transition: border-color 0.3s; }
    .call.point .left { border-color: var(--blue); }
    .call .hint { font-family: Inter, system-ui, sans-serif; font-size: 1rem; color: var(--blue); font-weight: 700; }

    .output {
      padding: 6px 16px;
      border-radius: 10px;
      background: var(--ink);
      color: white;
      opacity: 0;
      transition: opacity 0.4s;
    }

    .output.show { opacity: 1; }
    .output.broken { background: var(--red); }

    .caption {
      max-width: 900px;
      margin: 0 auto 8px;
      padding: 0 24px;
      min-height: 4.5em;
      font-size: 1.5rem;
      text-align: center;
    }

    code { font-family: Consolas, monospace; background: #f1ede7; padding: 1px 6px; border-radius: 4px; }

    .controls { display: flex; justify-content: center; align-items: center; gap: 16px; padding: 0 24px 24px; }

    .controls button {
      padding: 10px 24px;
      font: inherit;
      font-weight: 700;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: white;
      cursor: pointer;
    }

    .controls #next { background: var(--ink); color: white; }
    .controls button:disabled { opacity: 0.35; cursor: default; }
    .count { color: var(--muted); }

    @media (max-width: 760px) {
      .trucks { grid-template-columns: 1fr; }
      .call { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <h1>Methods and <code>this</code>: look left of the dot</h1>

  <div class="stage">
    <div class="outside" id="outside">
      <span class="tag" id="outside-tag">Outside the trucks</span>
      <div class="trucks">
        <div class="truck" id="taco">
          <div class="title">🌮 tacoTruck</div>
          <pre id="taco-code"></pre>
        </div>
        <div class="truck" id="pho">
          <div class="title">🍜 phoTruck</div>
          <pre id="pho-code"></pre>
        </div>
      </div>
    </div>

    <div class="call" id="call">
      <span id="call-code"></span>
      <span class="output" id="output"></span>
    </div>
  </div>

  <p class="caption" id="caption"></p>

  <div class="controls">
    <button id="back" type="button">← Back</button>
    <span class="count" id="count"></span>
    <button id="next" type="button">Next →</button>
  </div>

  <script>
    function truckCode(name, arrow) {
      const fn = arrow
        ? '<span class="arrow-syntax">() =&gt;</span> {'
        : "function () {";
      return 'name: "' + name + '",\n' +
        "describe: " + fn + "\n" +
        '  return "Welcome to " + <span class="this-word">this</span>.name + "!";\n' +
        "},";
    }

    // Each step: caption, which truck is called, and what shows.
    const steps = [
      { text: "Two trucks. Each has a <strong>method</strong>: a function stored inside the object. The code is the same in both.",
        call: null },
      { text: "Look at <code>this</code> inside <code>describe</code>. Which truck's name is it? It depends on <strong>how you call it</strong>.",
        call: null, hlThis: true },
      { text: "We call <code>tacoTruck.describe()</code>. Look <strong>left of the dot</strong>: tacoTruck.",
        call: "taco", point: true },
      { text: "So inside, <code>this</code> is tacoTruck, and <code>this.name</code> is \"Taco Rocket\".",
        call: "taco", point: true, hlThis: true, lit: "taco", out: "Welcome to Taco Rocket!" },
      { text: "Now <code>phoTruck.describe()</code>. Left of the dot: phoTruck. <strong>Same code, different truck.</strong>",
        call: "pho", point: true, hlThis: true, lit: "pho", out: "Welcome to Pho Real!" },
      { text: "Now both are written as <strong>arrow functions</strong>. Predict: what will <code>tacoTruck.describe()</code> say? Type it in the chat.",
        call: "taco", arrow: true },
      { text: "Arrow functions don't get their own <code>this</code>. They use the <code>this</code> from <strong>outside</strong> the truck. Out there, it's the browser window, and it has no truck name.",
        call: "taco", arrow: true, hlThis: true, outside: true, out: "Welcome to !", broken: true },
      { text: "<strong>The rule:</strong> arrows are great for lots of jobs. For a method that uses <code>this</code>, use <code>function</code>.",
        call: "taco", point: true, hlThis: true, lit: "taco", out: "Welcome to Taco Rocket!" }
    ];

    function el(id) { return document.getElementById(id); }
    let step = 0;

    function show() {
      const s = steps[step];
      el("taco-code").innerHTML = truckCode("Taco Rocket", !!s.arrow);
      el("pho-code").innerHTML = truckCode("Pho Real", !!s.arrow);
      el("taco").classList.toggle("hl-this", !!s.hlThis);
      el("pho").classList.toggle("hl-this", !!s.hlThis);
      el("taco").classList.toggle("lit", s.lit === "taco");
      el("pho").classList.toggle("lit", s.lit === "pho");
      el("outside").classList.toggle("lit", !!s.outside);
      el("outside-tag").textContent = s.outside ? "Outside the trucks: this = the browser window" : "Outside the trucks";

      const who = s.call === "pho" ? "phoTruck" : "tacoTruck";
      el("call-code").innerHTML = s.call
        ? '<span class="left">' + who + "</span>.describe()" + (s.point ? ' <span class="hint">← left of the dot</span>' : "")
        : "";
      el("call").classList.toggle("point", !!s.point);

      const out = el("output");
      out.textContent = s.out || "";
      out.classList.toggle("show", !!s.out);
      out.classList.toggle("broken", !!s.broken);

      el("caption").innerHTML = s.text;
      el("count").textContent = (step + 1) + " / " + steps.length;
      el("back").disabled = step === 0;
      el("next").disabled = step === steps.length - 1;
    }

    el("next").addEventListener("click", function () { if (step < steps.length - 1) { step++; show(); } });
    el("back").addEventListener("click", function () { if (step > 0) { step--; show(); } });
    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") el("next").click();
      if (e.key === "ArrowLeft") el("back").click();
    });

    show();
  </script>
</body>
</html>
